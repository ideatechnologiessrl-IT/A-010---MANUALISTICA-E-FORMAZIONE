<rect x="194" y="30" width="112" height="56" rx="10" fill="#fff" stroke="#CBD3DE"/><text x="250" y="52" font-size="12" font-weight="700" text-anchor="middle" fill="#111827">Reception</text><text x="250" y="70" font-size="9.5" text-anchor="middle" fill="#374151">ospiti e accessi</text><text x="250" y="81" font-size="8.5" text-anchor="middle" fill="#5B6472">ruolo aggiuntivo</text>
<rect x="0" y="170" width="96" height="54" rx="10" fill="#fff" stroke="#CBD3DE"/><text x="48" y="191" font-size="12" font-weight="700" text-anchor="middle" fill="#111827">Operatore</text><text x="48" y="207" font-size="9.5" text-anchor="middle" fill="#374151">mostra il suo QR</text><text x="48" y="218" font-size="8.5" text-anchor="middle" fill="#5B6472">telefono</text>
<rect x="224" y="170" width="96" height="54" rx="10" fill="#fff" stroke="#CBD3DE"/><text x="272" y="191" font-size="12" font-weight="700" text-anchor="middle" fill="#111827">Ospite</text><text x="272" y="207" font-size="9.5" text-anchor="middle" fill="#374151">esterno, dal–al</text><text x="272" y="218" font-size="8.5" text-anchor="middle" fill="#5B6472">telefono</text>
<rect x="104" y="236" width="112" height="54" rx="10" fill="#fff" stroke="#CBD3DE"/><text x="160" y="257" font-size="12" font-weight="700" text-anchor="middle" fill="#111827">Ristoratore</text><text x="160" y="273" font-size="9.5" text-anchor="middle" fill="#374151">legge il QR, conferma</text><text x="160" y="284" font-size="8.5" text-anchor="middle" fill="#5B6472">telefono della cassa</text>
