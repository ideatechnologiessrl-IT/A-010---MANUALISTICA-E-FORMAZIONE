<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" role="img" aria-label="Figura 1: la mappa dei cinque ruoli di RelDoxFood. Al centro RelDoxFood con regole, registro e report; intorno Amministratore (computer e tablet, evidenziato col numero 1), Reception, Operatore, Ospite e Ristoratore (telefono)">
<title>I cinque ruoli di RelDoxFood</title>
<style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}</style>
<g stroke="#CBD3DE" stroke-width="2"><line x1="160" y1="150" x2="70" y2="58"/><line x1="160" y1="150" x2="250" y2="58"/><line x1="160" y1="150" x2="48" y2="196"/><line x1="160" y1="150" x2="272" y2="196"/><line x1="160" y1="150" x2="160" y2="262"/></g>
<circle cx="160" cy="150" r="50" fill="#0F2A44"/><text x="160" y="146" font-size="12" font-weight="700" text-anchor="middle" fill="#fff">RelDoxFood</text><text x="160" y="161" font-size="8.5" text-anchor="middle" fill="#E8B23A">regole · registro</text><text x="160" y="172" font-size="8.5" text-anchor="middle" fill="#E8B23A">report</text>
