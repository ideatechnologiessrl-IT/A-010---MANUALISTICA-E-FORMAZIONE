<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 116" width="410" height="116" role="img" aria-label="RelDox — illumina il tuo lavoro">
  <!-- Testo LIVE in Space Grotesk (caricato globalmente dal sito). Per usi senza font, usare il PNG. -->
  <defs>
    <radialGradient id="rdxLkDisc" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#FBD474"/>
      <stop offset="55%" stop-color="#E8B23A"/>
      <stop offset="100%" stop-color="#E07A5F"/>
    </radialGradient>
  </defs>
  <!-- SOLE: altezza = dal top della R al fondo della "i" del payoff; accostato alla scritta -->
  <g transform="translate(2 16) scale(0.88)">
    <g stroke="#E8B23A" stroke-width="3.6" stroke-linecap="round">
      <line x1="50" y1="26" x2="50" y2="12"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(30 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(60 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(90 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(120 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(150 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(180 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(210 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(240 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(270 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(300 50 50)"/>
      <line x1="50" y1="26" x2="50" y2="12" transform="rotate(330 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="15" fill="url(#rdxLkDisc)"/>
  </g>
  <!-- wordmark -->
  <text x="84" y="65" font-family="'Space Grotesk',system-ui,sans-serif" font-weight="700" font-size="54" letter-spacing="2">
    <tspan fill="#0C6E86">R</tspan><tspan fill="#0C1B27">el</tspan><tspan fill="#E8B23A">D</tspan><tspan fill="#0C1B27">ox</tspan>
  </text>
  <!-- payoff -->
  <text x="86" y="94" font-family="system-ui,sans-serif" font-weight="600" font-size="14.5" letter-spacing="4.2" fill="#E07A5F">ILLUMINA IL TUO LAVORO</text>
</svg>
